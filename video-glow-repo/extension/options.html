<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Video Glow</title>
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <main>
    <h1><span class="logo"></span><span data-i18n="o_title"></span></h1>
    <p class="sub" id="version"></p>

    <section class="card">
      <h2 data-i18n="o_sites"></h2>
      <p class="muted" data-i18n="o_sites_hint"></p>
      <div class="row">
        <input type="text" id="siteInput" data-i18n-ph="o_site_add_ph">
        <button type="button" id="siteAdd" data-i18n="o_site_add"></button>
      </div>
      <ul class="sites" id="sites"></ul>
    </section>

    <section class="card">
      <h2 data-i18n="o_custom_sites"></h2>
      <p class="muted" data-i18n="o_custom_hint"></p>
      <ul class="sites" id="customSites"></ul>
    </section>

    <section class="card">
      <h2 data-i18n="o_backup"></h2>
      <div class="row">
        <button type="button" id="export" data-i18n="o_export"></button>
        <button type="button" id="importBtn" data-i18n="o_import"></button>
        <button type="button" id="resetAll" data-i18n="o_reset_all"></button>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </section>

    <section class="card">
      <h2 data-i18n="o_shortcuts"></h2>
      <p class="muted" data-i18n="o_shortcuts_text"></p>
      <button type="button" id="shortcuts" data-i18n="o_shortcuts_btn"></button>
    </section>

    <section class="card">
      <h2 data-i18n="o_limits"></h2>
      <p class="muted" data-i18n="o_limits_text"></p>
    </section>

    <section class="card">
      <h2 data-i18n="o_about"></h2>
      <p class="muted" data-i18n="o_privacy_text"></p>
      <div class="row">
        <button type="button" id="privacy" hidden data-i18n="o_privacy"></button>
        <button type="button" id="donate" hidden data-i18n="p_donate"></button>
      </div>
    </section>
  </main>
  <div id="toast"></div>

  <script src="defaults.js"></script>
  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
