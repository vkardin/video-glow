<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Glow — подсветка для любого видео</title>
  <meta name="description" content="Подсветка в цвет картинки вокруг любого видео в браузере. Бесплатное расширение для Chrome и Firefox.">
  <meta property="og:title" content="Video Glow">
  <meta property="og:image" content="https://vkardin.github.io/video-glow/img/glow-en.webp">
  <link rel="icon" href="img/icon32.png">
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="#"><img src="img/logo.svg" alt="">Video Glow</a>
      <nav class="nav">
        <a href="#demo" data-i18n="nav_demo"></a>
        <a href="#features" data-i18n="nav_features"></a>
        <a href="#install" data-i18n="nav_install"></a>
        <a href="#donate" data-i18n="nav_donate"></a>
        <a href="support.html" data-i18n="nav_support"></a>
      </nav>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="ru">RU</button>
        <button type="button" data-lang="uk">UK</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <a class="badge" href="#demo"><b>2.0</b><span data-i18n="hero_badge"></span></a>
        <h1 data-i18n="hero_title"></h1>
        <p class="lead" data-i18n="hero_lead"></p>
        <div class="cta">
          <a class="btn primary store-chrome" href="#install"><span data-i18n="btn_chrome"></span></a>
          <a class="btn store-firefox" href="#install"><span data-i18n="btn_firefox"></span></a>
        </div>
        <p class="free" data-i18n="hero_free"></p>
        <div class="screen"><img data-shot="glow" alt="" width="1280" height="800"></div>
      </div>
    </section>

    <section class="block demo" id="demo">
      <div class="wrap">
        <h2 data-i18n="demo_title"></h2>
        <p class="sub" data-i18n="demo_sub"></p>
        <div class="demo-grid">
          <div class="demo-stage" data-style="soft">
            <div class="demo-screen">
              <canvas class="halo" width="32" height="18" aria-hidden="true"></canvas>
              <canvas class="pic" width="640" height="360" role="img" data-i18n-aria="demo_alt"></canvas>
            </div>
          </div>
          <div class="demo-panel">
            <div class="dp-head">
              <span class="dp-brand"><img src="img/logo.svg" alt="" width="22" height="22">Video Glow</span>
              <label class="switch"><input type="checkbox" data-demo="on" checked data-i18n-aria="demo_on"><span></span></label>
            </div>
            <div class="dp-card">
              <span class="dp-lbl" data-i18n="demo_presets"></span>
              <div class="dp-chips">
                <button type="button" data-preset="soft" data-i18n="pr_soft"></button>
                <button type="button" data-preset="cinema" data-i18n="pr_cinema"></button>
                <button type="button" data-preset="neon" data-i18n="pr_neon"></button>
                <button type="button" data-preset="music" data-i18n="pr_music"></button>
                <button type="button" data-preset="night" data-i18n="pr_night"></button>
              </div>
            </div>
            <div class="dp-card">
              <span class="dp-lbl" data-i18n="demo_style"></span>
              <div class="dp-seg">
                <button type="button" data-style="soft" data-i18n="demo_soft"></button>
                <button type="button" data-style="led" data-i18n="demo_led"></button>
              </div>
              <div class="dp-row"><label for="dBright" data-i18n="demo_bright"></label><output for="dBright"></output></div>
              <input type="range" id="dBright" data-demo="bright" min="40" max="150" step="5" value="100">
              <div class="dp-row"><label for="dSize" data-i18n="demo_size"></label><output for="dSize"></output></div>
              <input type="range" id="dSize" data-demo="size" min="30" max="180" step="5" value="100">
              <label class="dp-check"><input type="checkbox" data-demo="room"><span data-i18n="demo_room"></span></label>
            </div>
            <p class="dp-note" data-i18n="demo_note"></p>
          </div>
        </div>
      </div>
    </section>

    <section class="block" id="features">
      <div class="wrap">
        <h2 data-i18n="f_title"></h2>
        <p class="sub" data-i18n="f_sub"></p>
        <div class="feat">
          <div class="pic"><img data-shot="led" alt="" width="1280" height="800" loading="lazy"></div>
          <div><h3 data-i18n="f_led_t"></h3><p data-i18n="f_led_d"></p></div>
        </div>
        <div class="feat">
          <div class="pic"><img data-shot="room" alt="" width="1280" height="800" loading="lazy"></div>
          <div><h3 data-i18n="f_room_t"></h3><p data-i18n="f_room_d"></p></div>
        </div>
        <div class="feat">
          <div class="pic"><img data-shot="settings" alt="" width="1280" height="800" loading="lazy"></div>
          <div><h3 data-i18n="f_set_t"></h3><p data-i18n="f_set_d"></p></div>
        </div>
      </div>
    </section>

    <section class="block">
      <div class="wrap">
        <h2 data-i18n="m_title"></h2>
        <p class="sub" data-i18n="m_sub"></p>
        <ul class="mlist" id="mlist"></ul>
      </div>
    </section>

    <section class="block" id="install">
      <div class="wrap">
        <h2 data-i18n="i_title"></h2>
        <p class="sub" data-i18n="i_sub"></p>
        <div class="install">
          <a class="tile store store-chrome" target="_blank" rel="noopener">
            <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#f3f2ef"/><circle cx="24" cy="24" r="9" fill="#0a0a0b"/><circle cx="24" cy="24" r="6" fill="#f3f2ef"/><path d="M24 15h19M16.2 28.5 6.7 12M31.8 28.5 22.3 45" stroke="#0a0a0b" stroke-width="2.4"/></svg>
            <div><b>Chrome Web Store</b><span data-i18n="i_chrome"></span></div>
          </a>
          <a class="tile store store-firefox" target="_blank" rel="noopener">
            <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#f3f2ef"/><path d="M24 9a15 15 0 1 0 14.6 11.6c-1.4 3-4 4.4-6.4 4.4 1.2-5.5-2.2-10-7-11.5 1.4 3-1.2 5.3-3.4 5.6-2.3.4-4 2.3-4 4.6 0 3.3 2.8 5.8 6.2 5.8" fill="none" stroke="#0a0a0b" stroke-width="2.6" stroke-linecap="round"/></svg>
            <div><b>Firefox Add-ons</b><span data-i18n="i_firefox"></span></div>
          </a>
        </div>
      </div>
    </section>

    <section class="block" id="feedback">
      <div class="wrap fb-cta">
        <div>
          <h2 data-i18n="fb_title"></h2>
          <p class="sub" data-i18n="fb_sub"></p>
        </div>
        <a class="btn primary" href="support.html" data-i18n="fb_btn"></a>
      </div>
    </section>

    <section class="block" id="more">
      <div class="wrap">
        <h2 data-i18n="more_title"></h2>
        <p class="sub" data-i18n="more_sub"></p>
        <div class="apps">
        <article class="app app-leveler">
          <a class="shot" href="https://vkardin.github.io/leveler/" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true"><img data-shot="apps/leveler" src="img/apps/leveler-en.webp" alt="" width="960" height="600" loading="lazy"></a>
          <div class="app-body">
            <header><img src="img/apps/leveler.svg" alt="" width="52" height="52"><div><h3>Leveler</h3><span data-i18n="lv_kind"></span></div></header>
            <p data-i18n="lv_desc"></p>
            <ul class="chips"><li data-i18n="lv_c1"></li><li data-i18n="lv_c2"></li><li data-i18n="lv_c3"></li><li data-i18n="lv_c4"></li></ul>
            <div class="app-links">
              <a class="btn-app primary" href="https://vkardin.github.io/leveler/" target="_blank" rel="noopener"><span data-i18n="more_site"></span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
              <a class="btn-app" href="https://chromewebstore.google.com/detail/phbjpipnbhffcegccfbbfabbhmgaelko" target="_blank" rel="noopener">Chrome Web Store</a>
              <a class="btn-app" href="https://github.com/vkardin/leveler" target="_blank" rel="noopener">GitHub</a>
            </div>
          </div>
        </article>
        <article class="app app-floatr">
          <a class="shot" href="https://vkardin.github.io/floatr/" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true"><img data-shot="apps/floatr" src="img/apps/floatr-en.webp" alt="" width="960" height="600" loading="lazy"></a>
          <div class="app-body">
            <header><img src="img/apps/floatr.svg" alt="" width="52" height="52"><div><h3>Floatr</h3><span data-i18n="fl_kind"></span></div></header>
            <p data-i18n="fl_desc"></p>
            <ul class="chips"><li data-i18n="fl_c1"></li><li data-i18n="fl_c2"></li><li data-i18n="fl_c3"></li><li data-i18n="fl_c4"></li></ul>
            <div class="app-links">
              <a class="btn-app primary" href="https://vkardin.github.io/floatr/" target="_blank" rel="noopener"><span data-i18n="more_site"></span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
              <a class="btn-app" href="https://github.com/vkardin/floatr/releases" target="_blank" rel="noopener" data-i18n="more_dl"></a>
              <a class="btn-app" href="https://github.com/vkardin/floatr" target="_blank" rel="noopener">GitHub</a>
            </div>
          </div>
        </article>
        <article class="app app-snapt">
          <a class="shot" href="https://vkardin.github.io/snapt/" data-href="sn_url" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true"><img src="img/apps/snapt.webp" alt="" width="960" height="600" loading="lazy"></a>
          <div class="app-body">
            <header><img src="img/apps/snapt.svg" alt="" width="52" height="52"><div><h3>Snapt</h3><span data-i18n="sn_kind"></span></div></header>
            <p data-i18n="sn_desc"></p>
            <ul class="chips"><li data-i18n="sn_c1"></li><li data-i18n="sn_c2"></li><li data-i18n="sn_c3"></li><li data-i18n="sn_c4"></li></ul>
            <div class="app-links">
              <a class="btn-app primary" href="https://vkardin.github.io/snapt/" data-href="sn_url" target="_blank" rel="noopener"><span data-i18n="more_site"></span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
              <a class="btn-app" href="https://github.com/vkardin/snapt/releases" target="_blank" rel="noopener" data-i18n="more_dl"></a>
              <a class="btn-app" href="https://github.com/vkardin/snapt" target="_blank" rel="noopener">GitHub</a>
            </div>
          </div>
        </article>
        <article class="app app-uni">
          <a class="shot" href="https://vkardin.github.io/uni-homebot/" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true"><img src="img/apps/uni.webp" alt="" width="960" height="600" loading="lazy"></a>
          <div class="app-body">
            <header><img src="img/apps/uni.svg" alt="" width="52" height="52"><div><h3>UNI</h3><span data-i18n="un_kind"></span></div></header>
            <p data-i18n="un_desc"></p>
            <ul class="chips"><li data-i18n="un_c1"></li><li data-i18n="un_c2"></li><li data-i18n="un_c3"></li><li data-i18n="un_c4"></li></ul>
            <div class="app-links">
              <a class="btn-app primary" href="https://vkardin.github.io/uni-homebot/" target="_blank" rel="noopener"><span data-i18n="more_site"></span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
              <a class="btn-app" href="https://github.com/vkardin/uni-homebot/releases/latest" target="_blank" rel="noopener" data-i18n="more_dl"></a>
              <a class="btn-app" href="https://github.com/vkardin/uni-homebot" target="_blank" rel="noopener">GitHub</a>
            </div>
          </div>
        </article>
        </div>
      </div>
    </section>

    <section class="block donate" id="donate">
      <div class="wrap">
        <h2 data-i18n="d_title"></h2>
        <p class="sub" data-i18n="d_sub"></p>
        <div class="wallets" id="wallets"></div>
        <p class="warn" data-i18n="d_warn"></p>
        <p class="thanks" data-i18n="d_thanks"></p>
      </div>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap">
      <span>© <span id="year"></span> Video Glow</span>
      <a href="support.html" data-i18n="nav_support"></a>
      <a href="privacy.html" data-i18n="privacy"></a>
      <a href="#donate" data-i18n="nav_donate"></a>
      <a href="#more" data-i18n="more_title"></a>
    </div>
  </footer>

  <template id="wallet">
    <div class="tile">
      <div class="coin"><i></i><div><b></b><small></small></div></div>
      <div class="qr"><img alt="QR" width="300" height="300"></div>
      <div class="addr"></div>
      <button type="button" class="btn copy"></button>
    </div>
  </template>

  <script src="app.js?v=11"></script>
  <script src="demo.js?v=1"></script>
</body>
</html>
