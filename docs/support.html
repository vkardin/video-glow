<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Glow — Feedback</title>
  <link rel="icon" href="img/icon32.png">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="./"><img src="img/logo.svg" alt="">Video Glow</a>
      <nav class="nav">
        <a href="./#features" data-i18n="nav_features"></a>
        <a href="./#install" data-i18n="nav_install"></a>
        <a href="./#donate" data-i18n="nav_donate"></a>
      </nav>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="ru">RU</button>
        <button type="button" data-lang="uk">UK</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero small">
      <div class="wrap">
        <h1 data-i18n="s_title"></h1>
        <p class="lead" data-i18n="s_lead"></p>
      </div>
    </section>

    <section class="block first">
      <div class="wrap fb-grid">
        <form class="tile fb-form" id="fbForm" hidden>
          <div class="seg" role="radiogroup">
            <label><input type="radio" name="kind" value="idea" checked><span data-i18n="f_idea"></span></label>
            <label><input type="radio" name="kind" value="bug"><span data-i18n="f_bug"></span></label>
            <label><input type="radio" name="kind" value="other"><span data-i18n="f_other"></span></label>
          </div>
          <label class="fld"><span data-i18n="f_msg"></span>
            <textarea name="message" rows="6" required maxlength="5000" data-ph="f_msg_ph"></textarea></label>
          <label class="fld"><span data-i18n="f_mail"></span>
            <input type="email" name="email" maxlength="200" data-ph="f_mail_ph"></label>
          <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off">
          <button type="submit" class="btn primary" data-i18n="f_send"></button>
          <p class="fb-status" id="fbStatus" role="status"></p>
        </form>
        <aside class="fb-side">
          <h3 data-i18n="s_gh"></h3>
          <a class="tile store" href="https://github.com/vkardin/video-glow/issues/new?template=idea.yml" target="_blank" rel="noopener">
            <span class="emoji" aria-hidden="true">💡</span>
            <div><b data-i18n="s_idea"></b><span data-i18n="s_idea_d"></span></div>
          </a>
          <a class="tile store" href="https://github.com/vkardin/video-glow/issues/new?template=bug.yml" target="_blank" rel="noopener">
            <span class="emoji" aria-hidden="true">🐞</span>
            <div><b data-i18n="s_bug"></b><span data-i18n="s_bug_d"></span></div>
          </a>
          <p class="note"><span data-i18n="s_note"></span> <a href="https://github.com/vkardin/video-glow/issues" target="_blank" rel="noopener" data-i18n="s_all"></a></p>
        </aside>
      </div>
    </section>

    <section class="block">
      <div class="wrap">
        <h2 data-i18n="q_title"></h2>
        <div class="faq">
          <details><summary data-i18n="q1"></summary><p data-i18n="a1"></p></details>
          <details><summary data-i18n="q2"></summary><p data-i18n="a2"></p></details>
          <details><summary data-i18n="q3"></summary><p data-i18n="a3"></p></details>
          <details><summary data-i18n="q4"></summary><p data-i18n="a4"></p></details>
          <details><summary data-i18n="q5"></summary><p data-i18n="a5"></p></details>
        </div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap">
      <a href="./">Video Glow</a>
      <a href="privacy.html" data-i18n="privacy"></a>
      <a href="./#donate" data-i18n="nav_donate"></a>
      <a href="./#more" data-i18n="more_title"></a>
    </div>
  </footer>

  <script src="app.js?v=8"></script>
</body>
</html>
