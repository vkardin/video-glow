<!doctype html><html><body style="margin:0;background:#0c1b24;color:#fff">
<div style="width:960px;margin:0 auto;padding-top:60px;background:#151515">
<div style="height:50px;background:#1c1c1c"></div>
<video id="v" muted autoplay playsinline style="display:block;width:960px;height:540px;background:#000"></video>
<div style="height:120px;background:#1c1c1c"></div></div>
<script>
const c=document.createElement('canvas');c.width=960;c.height=540;const x=c.getContext('2d');let t=0;
setInterval(()=>{t++;const g=x.createLinearGradient(0,0,960,0);g.addColorStop(0,'#8a2f2a');g.addColorStop(.5,'#c8604a');g.addColorStop(1,'#3a5a4a');x.fillStyle=g;x.fillRect(0,0,960,540);x.fillStyle='#e0b080';x.fillRect(300+Math.sin(t/20)*40,150,200,300);},33);
const v=document.getElementById('v');v.srcObject=c.captureStream(30);v.play();
</script></body></html>
