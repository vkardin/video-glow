<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Glow</title>
  <script src="ui-theme.js"></script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="sticky">
  <header>
    <div class="brand"><span class="logo"></span><b>Video Glow</b><em id="scopeBadge" hidden data-i18n="p_badge_site"></em><em id="proBadge" class="pro-badge" hidden data-i18n="p_pro_badge"></em></div>
    <div class="hbtns">
      <button id="foldAll" type="button" class="icon" data-i18n-title="p_fold_all">&#9776;</button>
      <label class="switch" data-i18n-title="p_enabled_title">
        <input type="checkbox" data-key="enabled"><span></span>
      </label>
    </div>
  </header>
  <nav class="quick">
    <button type="button" class="q" id="qRoom" data-i18n-title="q_room"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg></button>
    <button type="button" class="q" id="qLed" data-i18n-title="q_led"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="3" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="13" cy="8" r="1.3" fill="currentColor"/></svg></button>
    <span class="qsep"></span>
    <button type="button" class="q" id="qPanel" data-i18n-title="q_panel"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M9.5 2.5v11"/></svg></button>
    <button type="button" class="q" id="qWin" data-i18n-title="q_glowwin" hidden><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="3" width="13" height="10" rx="2"/><rect x="8" y="8" width="5" height="3.5" rx="1" fill="currentColor" stroke="none"/></svg></button>
    <button type="button" class="q" id="qOptions" data-i18n-title="q_options"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
    <button type="button" class="q" id="qReset" data-i18n-title="q_reset"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.8 8a5.2 5.2 0 1 0 1.6-3.8"/><path d="M2.5 2.2v3h3"/></svg></button>
  </nav>
  </div>

  <div id="proBar" class="probar" hidden>
    <span id="proText"></span>
    <button id="proBtn" type="button"></button>
  </div>

  <div id="perm" class="status" data-kind="warn" hidden>
    <i></i>
    <div><span data-i18n="p_perm_need"></span><button id="permBtn" type="button" data-i18n="p_perm_btn"></button></div>
  </div>

  <div id="status" class="status" data-kind="info">
    <i></i>
    <div><span id="statusText"></span><small id="statusNote"></small></div>
  </div>

  <section id="siteCard" class="card compact">
    <label class="check">
      <input type="checkbox" id="siteOff">
      <span id="siteOffText"></span>
    </label>
    <label class="check" id="scope">
      <input type="checkbox" id="siteMode">
      <span><span id="siteModeText"></span><small data-i18n="p_scope_hint"></small></span>
    </label>
    <button id="scopeReset" type="button" hidden data-i18n="p_scope_reset"></button>
  </section>

  <section class="card" id="presetsCard">
    <div class="top"><span class="lbl" data-i18n="p_presets"></span></div>
    <div id="presets" class="chips"></div>
    <p id="autoNote" class="note" hidden></p>
    <div class="prow">
      <button id="presetSaveBtn" type="button" class="link" data-i18n="p_preset_save"></button>
      <button id="presetEditBtn" type="button" class="link" data-i18n="p_preset_manage"></button>
    </div>
    <div id="presetSave" class="row" hidden>
      <input type="text" id="presetName" maxlength="40" data-i18n-ph="p_preset_name_ph">
      <button id="presetOk" type="button" data-i18n="p_preset_ok"></button>
    </div>
  </section>

  <section class="card" id="quickCard">
    <div id="quickSliders"></div>
  </section>

  <details class="card" open data-sec="page">
    <summary><h3 data-i18n="p_page"></h3><label class="switch" data-i18n-title="p_page"><input type="checkbox" data-key="pageGlow"><span></span></label></summary>
    <div class="ctl">
      <div class="top"><span class="lbl" data-i18n="p_shape"></span></div>
      <div class="seg" data-key="shape">
        <button type="button" data-v="rect"><i style="border-radius:1px"></i><span data-i18n="p_shape_rect"></span></button>
        <button type="button" data-v="rounded"><i style="border-radius:5px"></i><span data-i18n="p_shape_rounded"></span></button>
        <button type="button" data-v="circle"><i style="border-radius:50%"></i><span data-i18n="p_shape_circle"></span></button>
      </div>
    </div>
    <div class="ctl">
      <div class="top"><span class="lbl" data-i18n="p_style"></span></div>
      <div class="seg" data-key="glowStyle">
        <button type="button" data-v="soft"><i style="border-radius:5px;filter:blur(1.5px)"></i><span data-i18n="p_style_soft"></span></button>
        <button type="button" data-v="led"><i style="border-radius:50%;width:6px;height:6px"></i><span data-i18n="p_style_led"></span></button>
      </div>
      <div class="hint" data-i18n="p_style_hint"></div>
    </div>
    <div id="ledSliders"></div>
    <label class="check">
      <input type="checkbox" data-key="room">
      <span><span data-i18n="p_room"></span><small data-i18n="p_room_hint"></small></span>
    </label>
    <div id="roomSliders"></div>
    <div id="glowSliders"></div>
  </details>

  <details class="card" data-sec="tune">
    <summary><h3 data-i18n="p_tune"></h3></summary>
    <div id="tuneSliders"></div>
    <label class="check">
      <input type="checkbox" data-key="seamless">
      <span><span data-i18n="p_seamless"></span><small data-i18n="p_seamless_hint"></small></span>
    </label>
    <div class="ctl">
      <div class="top">
        <span class="lbl" data-i18n="p_fps"></span>
        <select data-key="fps" data-type="number">
          <option value="15">15</option>
          <option value="24">24</option>
          <option value="30">30</option>
          <option value="60">60</option>
        </select>
      </div>
    </div>
    <div class="ctl">
      <div class="top">
        <span class="lbl" data-i18n="p_mode"></span>
        <select data-key="pageMode">
          <option value="screen" data-i18n="p_mode_screen"></option>
          <option value="normal" data-i18n="p_mode_normal"></option>
          <option value="under" data-i18n="p_mode_under"></option>
        </select>
      </div>
      <div class="hint" data-i18n="p_mode_hint"></div>
    </div>
    <label class="check">
      <input type="checkbox" data-key="dim">
      <span><span data-i18n="p_dim"></span><small data-i18n="p_dim_hint"></small></span>
    </label>
    <div id="dimSliders"></div>
  </details>

  <details class="card" data-sec="fs">
    <summary><h3 data-i18n="p_fs"></h3><label class="switch" data-i18n-title="p_fs"><input type="checkbox" data-key="fullscreenGlow"><span></span></label></summary>
    <label class="check">
      <input type="checkbox" data-key="fullscreenFill">
      <span><span data-i18n="p_fs_fill"></span><small data-i18n="p_fs_fill_hint"></small></span>
    </label>
    <label class="check">
      <input type="checkbox" id="fsSame">
      <span><span data-i18n="p_fs_same"></span><small data-i18n="p_fs_same_hint"></small></span>
    </label>
    <div id="fsOwn" hidden>
      <div id="fsSliders"></div>
      <div class="ctl">
        <div class="top">
          <span class="lbl" data-i18n="p_pause_mode"></span>
          <select data-key="fsPauseMode">
            <option value="fade" data-i18n="p_pause_fade"></option>
            <option value="hold" data-i18n="p_pause_hold"></option>
            <option value="delay" data-i18n="p_pause_delay"></option>
          </select>
        </div>
      </div>
    </div>
    <label class="check">
      <input type="checkbox" id="fsShapeOwn">
      <span><span data-i18n="p_fs_shape_own"></span><small data-i18n="p_fs_shape_own_hint"></small></span>
    </label>
    <div id="fsShapeBox" hidden>
      <div class="ctl">
        <div class="top"><span class="lbl" data-i18n="p_shape"></span></div>
        <div class="seg" data-key="fsShape">
          <button type="button" data-v="rect"><i style="border-radius:1px"></i><span data-i18n="p_shape_rect"></span></button>
          <button type="button" data-v="rounded"><i style="border-radius:5px"></i><span data-i18n="p_shape_rounded"></span></button>
          <button type="button" data-v="circle"><i style="border-radius:50%"></i><span data-i18n="p_shape_circle"></span></button>
        </div>
      </div>
      <div id="fsShapeSliders"></div>
      <div class="hint" id="fsShapeNote" data-i18n="p_fs_shape_note"></div>
    </div>
  </details>

  <details class="card" data-sec="behavior">
    <summary><h3 data-i18n="p_behavior"></h3></summary>
    <div class="ctl">
      <div class="top">
        <span class="lbl" data-i18n="p_pause_mode"></span>
        <select data-key="pauseMode">
          <option value="fade" data-i18n="p_pause_fade"></option>
          <option value="hold" data-i18n="p_pause_hold"></option>
          <option value="delay" data-i18n="p_pause_delay"></option>
        </select>
      </div>
    </div>
    <div id="pauseSliders"></div>
    <label class="check">
      <input type="checkbox" data-key="cropBars">
      <span><span data-i18n="p_cropbars"></span><small data-i18n="p_cropbars_hint"></small></span>
    </label>
    <label class="check">
      <input type="checkbox" data-key="fillBars">
      <span><span data-i18n="p_fillbars"></span><small data-i18n="p_fillbars_hint"></small></span>
    </label>
    <label class="check">
      <input type="checkbox" data-key="hoverButton">
      <span><span data-i18n="p_hover"></span><small data-i18n="p_hover_hint"></small></span>
    </label>
    <label class="check">
      <input type="checkbox" data-key="adaptive">
      <span><span data-i18n="p_adaptive"></span><small data-i18n="p_adaptive_hint"></small></span>
    </label>
    <div class="ctl">
      <div class="top">
        <span class="lbl" data-i18n="p_lite"></span>
        <select data-key="lite">
          <option value="auto" data-i18n="p_lite_auto"></option>
          <option value="on" data-i18n="p_lite_on"></option>
          <option value="off" data-i18n="p_lite_off"></option>
        </select>
      </div>
      <div class="hint" data-i18n="p_lite_hint"></div>
    </div>
    <label class="check">
      <input type="checkbox" data-key="zoomPan">
      <span><span data-i18n="p_zoompan"></span><small data-i18n="p_zoompan_hint"></small></span>
    </label>
    <label class="check">
      <input type="checkbox" data-key="ecoBattery">
      <span><span data-i18n="p_eco"></span><small data-i18n="p_eco_hint"></small></span>
    </label>
    <div id="advSliders" class="adv"></div>
  
  </details>

  <details class="card" data-sec="picture">
    <summary><h3 data-i18n="p_picture"></h3></summary>
    <div class="sub">
      <h4 data-i18n="p_pro_title_bars"></h4>
    <div class="ctl">
      <div class="top">
        <span class="lbl" data-i18n="p_bars_mode"></span>
        <select data-key="barsMode">
          <option value="auto" data-i18n="p_bars_auto"></option>
          <option value="force" data-i18n="p_bars_force"></option>
          <option value="manual" data-i18n="p_bars_manual"></option>
        </select>
      </div>
      <div class="hint" data-i18n="p_bars_hint"></div>
    </div>
    <div id="barSliders"></div>
    <label class="check">
      <input type="checkbox" data-key="barsHide">
      <span><span data-i18n="p_barshide"></span><small data-i18n="p_barshide_hint"></small></span>
    </label>
    <div id="barsFillSliders"></div>
  
    </div>
    <div class="sub">
      <h4 data-i18n="p_pro_title_fx"></h4>
    <div id="fxPresets" class="chips fx"></div>
    <label class="check">
      <input type="checkbox" data-key="fxOn">
      <span data-i18n="p_fx"></span>
    </label>
    <div id="fxSliders"></div>
  
    </div>
    <div class="sub">
      <h4 data-i18n="p_pro_title_night"></h4>
    <label class="check">
      <input type="checkbox" data-key="nightOn">
      <span><span data-i18n="p_night"></span><small data-i18n="p_night_hint"></small></span>
    </label>
    <div id="nightOpts">
      <div class="ctl">
        <div class="top">
          <span class="lbl" data-i18n="p_night_from"></span>
          <select data-key="nightFrom" data-type="number" data-hours></select>
        </div>
      </div>
      <div class="ctl">
        <div class="top">
          <span class="lbl" data-i18n="p_night_to"></span>
          <select data-key="nightTo" data-type="number" data-hours></select>
        </div>
      </div>
      <div id="nightSliders"></div>
    </div>
  
    </div>
  </details>

  <details class="card" data-sec="comfort">
    <summary><h3 data-i18n="p_comfort"></h3></summary>
    <div class="sub">
      <h4 data-i18n="p_pro_title_eyes"></h4>
    <label class="check">
      <input type="checkbox" data-key="guard">
      <span><span data-i18n="p_guard"></span><small data-i18n="p_guard_hint"></small></span>
    </label>
    <div id="guardOpts">
      <div class="ctl">
        <div class="top">
          <span class="lbl" data-i18n="p_guard_sens"></span>
          <select data-key="guardSens" data-type="number">
            <option value="1" data-i18n="p_sens_1"></option>
            <option value="2" data-i18n="p_sens_2"></option>
            <option value="3" data-i18n="p_sens_3"></option>
          </select>
        </div>
      </div>
      <div id="guardSliders"></div>
      <label class="check">
        <input type="checkbox" data-key="guardVideo">
        <span data-i18n="p_guard_video"></span>
      </label>
    </div>
    <div id="calmSliders" class="adv"></div>
  
    </div>
    <div class="sub">
      <h4 data-i18n="p_pro_title_pulse"></h4>
    <label class="check">
      <input type="checkbox" data-key="pulse">
      <span><span data-i18n="p_pulse"></span><small data-i18n="p_pulse_hint"></small></span>
    </label>
    <div id="pulseOpts">
      <div id="pulseSliders"></div>
      <div class="ctl">
        <div class="top">
          <span class="lbl" data-i18n="p_pulse_mode"></span>
          <select data-key="pulseMode">
            <option value="bass" data-i18n="p_pulse_bass"></option>
            <option value="all" data-i18n="p_pulse_all"></option>
          </select>
        </div>
      </div>
    </div>
  
    </div>
    <div class="sub">
      <h4 data-i18n="p_title_scene"></h4>
    <label class="check">
      <input type="checkbox" data-key="scene">
      <span><span data-i18n="p_scene"></span><small data-i18n="p_scene_hint"></small></span>
    </label>
    <div id="sceneOpts">
      <div id="sceneSliders"></div>
    </div>
      <div class="ctl">
        <div class="top">
          <span class="lbl" data-i18n="p_curve"></span>
          <select data-key="colorCurve">
            <option value="normal" data-i18n="p_curve_normal"></option>
            <option value="soft" data-i18n="p_curve_soft"></option>
            <option value="cinema" data-i18n="p_curve_cinema"></option>
            <option value="sharp" data-i18n="p_curve_sharp"></option>
          </select>
        </div>
      </div>
    </div>
  </details>

  <footer>
    <button id="reset" type="button" data-i18n="p_reset"></button>
    <button id="openPanel" type="button" data-i18n="p_panel_btn"></button>
    <button id="openOptions" type="button" class="primary" data-i18n="p_options"></button>
    <button id="site" type="button" hidden data-i18n="p_site"></button>
    <button id="donate" type="button" hidden data-i18n="p_donate"></button>
  </footer>
  <p class="note" data-i18n="p_note"></p>

  <script src="defaults.js"></script>
  <script src="i18n.js"></script>
  <script src="presets.js"></script>
  <script src="popup.js"></script>
</body>
</html>
