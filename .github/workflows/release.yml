name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, for example 1.4.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Chrome and Firefox zips
        run: python3 tools/build.py extension "${VERSION#v}" dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${VERSION#v}"
          gh release create "v$V" dist/*.zip --target "$GITHUB_SHA" --title "Video Glow $V" --generate-notes
